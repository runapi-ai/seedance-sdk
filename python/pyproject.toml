[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-seedance"
version = "0.2.3"
description = "RunAPI Seedance SDK for text-to-video workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "seedance", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "text-to-video", "video-api", "seedance-api"]
dependencies = ["runapi-core>=0.5.1"]

[project.urls]
Homepage = "https://runapi.ai/models/seedance"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/seedance-sdk"
Issues = "https://github.com/runapi-ai/seedance-sdk/issues"
Changelog = "https://github.com/runapi-ai/seedance-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/seedance-sdk/releases/tag/python%2Fv0.2.3"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "seedance"
